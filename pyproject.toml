[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-masking"
version = "0.1.0"
description = "PII Detection and Secure PDF Redaction MVP"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nguyen Dinh Phu Vinh", email = "ndpv6ntl@gmail.com" },
    { name = "PII Masking Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "psutil>=5.9.8",
]

[project.optional-dependencies]
pdf = [
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
]
ml = [
    "spacy>=3.7.5,<3.9.0",
    "torch>=2.2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "evaluation"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
